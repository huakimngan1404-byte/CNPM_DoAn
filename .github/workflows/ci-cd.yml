name: CI/CD

on:
  pull_request:
    paths:
      - "DoAn/**"
      - "render.yaml"
      - ".github/workflows/ci-cd.yml"
  push:
    branches:
      - main
    paths:
      - "DoAn/**"
      - "render.yaml"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install translation service dependencies
        run: python -m pip install -r DoAn/BE/translation-service/requirements.txt
      - name: Check backend Python syntax
        run: python -m compileall -q DoAn/BE/site-service DoAn/BE/translation-service
      - name: Run translation service tests
        working-directory: DoAn/BE/translation-service
        run: python -m pytest -q test_error_handling.py

  frontend:
    name: Build frontends
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Visitor website
            directory: DoAn/FE/APP/thuyet-minh-app
            build: npx expo export --platform web
          - name: Admin website
            directory: DoAn/FE/WEB/thuyet-minh-web
            build: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.build }}

  deploy:
    name: Deploy to Render
    needs:
      - backend
      - frontend
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render deploy hooks are configured
        env:
          SITE_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_SITE_SERVICE }}
          TRANSLATION_SERVICE: ${{ secrets.RENDER_DEPLOY_HOOK_TRANSLATION_SERVICE }}
          WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          ADMIN: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN }}
        run: |
          if [ -z "$SITE_SERVICE" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_SITE_SERVICE. Add the Render deploy hook as a GitHub Actions repository secret."
            exit 1
          fi
          if [ -z "$TRANSLATION_SERVICE" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_TRANSLATION_SERVICE. Add the Render deploy hook as a GitHub Actions repository secret."
            exit 1
          fi
          if [ -z "$WEB" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_WEB. Add the Render deploy hook as a GitHub Actions repository secret."
            exit 1
          fi
          if [ -z "$ADMIN" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_ADMIN. Add the Render deploy hook as a GitHub Actions repository secret."
            exit 1
          fi
      - name: Deploy site API
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_SITE_SERVICE }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Deploy translation API
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_TRANSLATION_SERVICE }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Deploy visitor website
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Deploy admin website
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

services:
  - type: web
    name: quan1-site-service
    runtime: docker
    plan: free
    rootDir: DoAn/BE/site-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: district1_historical_db

  - type: web
    name: quan1-translation-service
    runtime: docker
    plan: free
    rootDir: DoAn/BE/translation-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DATABASE
        value: district1_historical_db
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: web
    name: quan1-web
    runtime: static
    rootDir: DoAn/FE/APP/thuyet-minh-app
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://quan1-site-service-a1vt.onrender.com
      - key: EXPO_PUBLIC_TRANSLATION_URL
        value: https://quan1-translation-service-d3xw.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: quan1-admin
    runtime: static
    rootDir: DoAn/FE/WEB/thuyet-minh-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://quan1-site-service-a1vt.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

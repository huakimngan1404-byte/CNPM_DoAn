version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:latest
    container_name: quan1_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Site Service (Cổng 8000)
  site-service:
    build: ./site-service
    container_name: quan1_site_service
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - TRANSLATION_SERVICE_URL=http://translation-service:8001
    depends_on:
      - mongo

  # 3. Translation & Audio Service (Cổng 8001)
  translation-service:
    build: ./translation-service
    container_name: quan1_translation_service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      # Configure at least one AI provider key in the project-root .env to enable AI translation.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MYMEMORY_EMAIL=${MYMEMORY_EMAIL:-}
    volumes:
      - audio_data:/app/static/audio
    depends_on:
      - mongo

volumes:
  mongo_data:
  audio_data:
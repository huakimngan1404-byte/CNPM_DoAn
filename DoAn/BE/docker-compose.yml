services:
  site-service:
    build: ./site-service
    container_name: quan1_site_service
    ports:
      - "8000:8002"
    environment:
      MONGO_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-district1_historical_db}
      TRANSLATION_SERVICE_URL: http://translation-service:8001
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
  translation-service:
    build: ./translation-service
    container_name: quan1_translation_service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGO_DATABASE: ${MONGO_DATABASE:-district1_historical_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL:-}
    volumes:
      - audio_data:/app/static/audio

volumes:
  audio_data:

version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: historical_mongo
    ports:
      - "27018:27017"

  site-service:
    build: ./site-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://mongodb:27017

  translation-service:
    build: ./translation-service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - GEMINI_API_KEY=AQ.Ab8RN6IYu_1fhM-dglsoWlxVEauXgikbxnMnZmsk7PX4arGO6A
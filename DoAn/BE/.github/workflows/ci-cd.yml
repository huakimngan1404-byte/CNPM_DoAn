name: CI/CD Pipeline for District 1 Architecture BE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # PHẦN 1: CONTINUOUS INTEGRATION (CI)
  # ==========================================
  continuous-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Chạy kiểm thử tự động cho cả 2 service của bạn
        service: [site-service, translation-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn motor pydantic httpx pytest

      - name: Run tests for ${{ matrix.service }}
        run: |
          echo "Đang kiểm tra cú pháp và chạy test cho ${{ matrix.service }}..."
          #pytest BE/${{ matrix.service }} (Mở dòng này khi bạn viết file test)

  # ==========================================
  # PHẦN 2: CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  continuous-deployment:
    needs: continuous-integration # Chỉ chạy khi CI đã pass hoàn toàn
    runs-on: ubuntu-latest
    if: github.ref == 'main' && github.event_name == 'push' # Chỉ deploy khi push lên nhánh main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Site Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE/site-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/quan1-site-service:latest

      - name: Build and Push Translation Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE/translation-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/quan1-translation-service:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/your/project/BE
            git pull origin main
            docker compose pull
            docker compose up -d --force-recreate
            echo "Đã tự động cập nhật và triển khai Multi-Services thành công!"